[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptocore"
version = "0.4.1"
description = "Консольный криптографический провайдер AES, SHA-256 и SHA3-256"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pycryptodome>=3.20,<4",
]

[project.optional-dependencies]
nist = [
    "nistrng==1.2.3",
]

[project.scripts]
cryptocore = "cryptocore.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
